<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario Le Juste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', sans-serif;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Menú Principal -->
    <div id="menu-principal" class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- Título -->
            <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-8">
                Sistema de Gestión de Inventario Le Juste
            </h1>

            <!-- Logo -->
            <div class="flex justify-center mb-12">
                <div class="w-64 h-32 bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden">
                    <img id="logo-img"
                         src="le-juste-with-subline-4-1.svg"
                         alt="Le Juste Logo"
                         class="max-w-full max-h-full object-contain"
                         onerror="this.onerror=null; this.src='le-juste-with-subline-4-1.jpg'">
                </div>
            </div>

            <!-- Botones de menú -->
            <div class="max-w-md mx-auto space-y-4">
                <button onclick="navigateTo('gestion-inventario')"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105">
                    Gestión de Inventario
                </button>

                <button onclick="navigateTo('armar-pedidos')"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105">
                    Armar Pedidos
                </button>

                <button onclick="navigateTo('calculo-shopify')"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105">
                    Ver Disponibilidad Shopify
                </button>

                <button onclick="cerrarSesion()"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- Gestión de Inventario -->
    <div id="gestion-inventario" class="hidden container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
                Gestión de Inventario
            </h2>

            <!-- Tabla de inventario -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
                <div class="overflow-x-auto">
                    <table id="tabla-inventario" class="w-full">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Aroma</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Tipo</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Stock Actual</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex justify-center space-x-4">
                <button onclick="guardarCambiosInventario()"
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200">
                    Guardar Cambios
                </button>

                <button onclick="navigateTo('menu-principal')"
                        class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200">
                    Volver al Menú
                </button>
            </div>
        </div>
    </div>

    <!-- Armar Pedidos -->
    <div id="armar-pedidos" class="hidden container mx-auto px-4 py-8">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
                Armar Pedidos
            </h2>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Panel izquierdo: Formulario -->
                <div class="lg:col-span-1 space-y-4">
                    <!-- Tipo de Pedido -->
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">
                            Tipo de Pedido
                        </label>
                        <select id="combo-tipo-pack"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Seleccionar...</option>
                            <option value="unitario-case">Unitario - Case</option>
                            <option value="unitario-recarga">Unitario - Recarga</option>
                            <option value="bipack">Bipack (1 Case + 1 Recarga)</option>
                            <option value="tripack">Tripack (1 Case + 2 Recargas)</option>
                        </select>
                    </div>

                    <!-- Elegir Aromas -->
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <h3 class="text-sm font-semibold text-gray-700 mb-4 text-center">
                            Elegir aromas
                        </h3>

                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">N°1</label>
                                <input type="number" id="spin-1" min="0" value="0"
                                       class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>

                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">N°2</label>
                                <input type="number" id="spin-2" min="0" value="0"
                                       class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>

                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">N°3</label>
                                <input type="number" id="spin-3" min="0" value="0"
                                       class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>

                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">N°4</label>
                                <input type="number" id="spin-4" min="0" value="0"
                                       class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <button onclick="agregarALista()"
                                class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                            Agregar a la lista
                        </button>
                    </div>

                    <!-- Instrucciones -->
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <h3 class="text-sm font-semibold text-gray-700 mb-2 text-center">
                            Instrucciones para armar cada pedido
                        </h3>
                        <div id="instrucciones" class="text-sm text-gray-600 bg-gray-50 p-3 rounded border border-gray-200 min-h-[100px]">
                            <!-- Se llenará dinámicamente -->
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="space-y-2">
                        <button onclick="procesarPedidos()"
                                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                            Procesar y Descontar Stock
                        </button>

                        <button onclick="navigateTo('menu-principal')"
                                class="w-full bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                            Volver al Menú
                        </button>
                    </div>
                </div>

                <!-- Panel derecho: Tabla de pedidos -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                        <div class="overflow-x-auto">
                            <table id="tabla-pedidos" class="w-full">
                                <thead class="bg-gray-800 text-white">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-sm font-semibold">Tipo de Pedido</th>
                                        <th class="px-4 py-3 text-left text-sm font-semibold">Aromas Seleccionados</th>
                                        <th class="px-4 py-3 text-left text-sm font-semibold">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200">
                                    <!-- Se llenará dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Disponibilidad Shopify -->
    <div id="calculo-shopify" class="hidden container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">
                Disponibilidad Máxima para Shopify
            </h2>

            <!-- Tabla de disponibilidad -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
                <div class="overflow-x-auto">
                    <table id="tabla-shopify" class="w-full">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Tipo de Pack</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Combinación Aromas</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold">Stock Máximo</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex justify-center space-x-4">
                <button onclick="recalcularDisponibilidad()"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200">
                    Recalcular Disponibilidad
                </button>

                <button onclick="navigateTo('menu-principal')"
                        class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200">
                    Volver al Menú
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
